<!doctype html><meta charset="utf-8"><title>Reports</title><h1>Reports</h1><p>Each run emits <code>report.json</code>, <code>report.html</code>, <code>disk_map.txt</code>, and extracted files. Batch runs add <code>batch_summary.json</code>. JSON contains source hashes, backend, artifacts, offset map, warnings, and execution time.</p>
