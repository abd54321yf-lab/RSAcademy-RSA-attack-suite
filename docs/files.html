<!doctype html><meta charset="utf-8"><title>Files</title><h1>File Reference</h1><p><code>rsa/signature.py</code> defines FileSignature and the catalogue. <code>rsa/matcher.py</code> performs deterministic scanning. <code>rsa/fragment.py</code> defines RsaArtifact and overlap resolution. <code>rsa/pipeline.py</code> connects carving to export. <code>output/reports.py</code> keeps rendering separate from core logic.</p>
